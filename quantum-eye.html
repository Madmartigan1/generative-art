<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quantum Observer Effect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    padding: 16px;
  }
  h1 {
    color: rgba(100,220,200,0.65);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  canvas {
    border-radius: 10px;
    border: 1px solid rgba(0,200,160,0.1);
    box-shadow: 0 0 50px rgba(0,180,140,0.12), 0 0 100px rgba(0,100,200,0.07);
    max-width: 100%;
    display: block;
  }
  .legend {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    max-width: 440px;
    width: 100%;
  }
  .card {
    background: rgba(0,200,160,0.04);
    border: 1px solid rgba(0,200,160,0.1);
    border-radius: 7px;
    padding: 9px;
  }
  .card-title {
    color: rgba(100,220,200,0.75);
    font-size: 9px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }
  .card-desc {
    color: rgba(150,200,190,0.45);
    font-size: 8.5px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<h1>Quantum Observer Effect</h1>
<canvas id="c" width="500" height="560"></canvas>
<div class="legend">
  <div class="card">
    <div class="card-title">🌊 Photons</div>
    <div class="card-desc">Traveling as probability waves — in superposition until observed</div>
  </div>
  <div class="card">
    <div class="card-title">⚡ Collapse</div>
    <div class="card-desc">Hitting the pupil forces a definite state — wave to particle</div>
  </div>
  <div class="card">
    <div class="card-title">💫 Ripple</div>
    <div class="card-desc">Each flash = a real collapse event at the moment of observation</div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 500, H = 560;

  function resize() {
    var size = Math.min(window.innerWidth - 32, 500);
    canvas.style.width = size + 'px';
    canvas.style.height = Math.round(size * 1.12) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a, b) { return Math.random() * (b - a) + a; }
  function hsl(h, s, l, a) {
    if (a === undefined) a = 1;
    return 'hsla(' + Math.round(h) + ',' + Math.round(s) + '%,' + Math.round(l) + '%,' + a + ')';
  }

  function drawEllipsePath(cx, cy, rx, ry) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(rx, ry);
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.restore();
  }

  function torusPoint(u, v, R, r) {
    return {
      x: (R + r * Math.cos(v)) * Math.cos(u),
      y: (R + r * Math.cos(v)) * Math.sin(u),
      z: r * Math.sin(v)
    };
  }

  function project(x, y, z) {
    var fov = 340, cx = W / 2, cy = H / 2 - 10;
    var scale = fov / (fov + z);
    return { sx: cx + x * scale, sy: cy + y * scale, scale: scale };
  }

  function Photon() { this.reset(); }
  Photon.prototype.reset = function() {
    var angle = rand(0, Math.PI * 2);
    var dist = rand(200, 280);
    this.x = Math.cos(angle) * dist;
    this.y = Math.sin(angle) * dist;
    this.z = rand(-50, 50);
    var tx = rand(-12, 12), ty = rand(-12, 12);
    this.vx = (tx - this.x) * 0.013;
    this.vy = (ty - this.y) * 0.013;
    this.vz = -this.z * 0.013;
    this.hue = rand(150, 240);
    this.life = 0;
    this.maxLife = rand(55, 110);
    this.collapsed = false;
    this.collapseTimer = 0;
    this.trail = [];
    this.size = rand(2, 3.5);
    this.waveAmp = rand(6, 18);
    this.waveFreq = rand(0.3, 0.8);
    this.wavePhase = rand(0, Math.PI * 2);
  };
  Photon.prototype.update = function(tick) {
    if (this.collapsed) {
      this.collapseTimer++;
      if (this.collapseTimer > 38) this.reset();
      return;
    }
    this.trail.push({ x: this.x, y: this.y, z: this.z });
    if (this.trail.length > 16) this.trail.shift();
    var wave = Math.sin(tick * this.waveFreq + this.wavePhase) * this.waveAmp;
    var perpAngle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
    this.x += this.vx + Math.cos(perpAngle) * wave * 0.04;
    this.y += this.vy + Math.sin(perpAngle) * wave * 0.04;
    this.z += this.vz;
    this.life++;
    var d = Math.sqrt(this.x * this.x + this.y * this.y);
    if (d < 32 || this.life > this.maxLife) {
      this.collapsed = true;
      this.collapseTimer = 0;
    }
  };

  function Ripple(x, y) {
    this.x = x; this.y = y;
    this.r = 0; this.life = 0; this.maxLife = 48;
  }
  Ripple.prototype.update = function() { this.r += 2.8; this.life++; };
  Ripple.prototype.isDead = function() { return this.life >= this.maxLife; };
  Ripple.prototype.getAlpha = function() { return 1 - this.life / this.maxLife; };

  var photons = [];
  for (var p = 0; p < 20; p++) photons.push(new Photon());
  var ripples = [];
  var tick = 0;
  var angle = 0;

  function draw() {
    tick++;
    angle += 0.004;
    var cx = W / 2, cy = H / 2 - 10;
    var tilt = 0.3;

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, W, H);

    // Torus dots
    var R = 98, r = 42, steps = 55;
    for (var i = 0; i < steps; i++) {
      var u = (i / steps) * Math.PI * 2 + angle;
      for (var j = 0; j < steps; j++) {
        var v = (j / steps) * Math.PI * 2;
        var pt = torusPoint(u, v, R, r);
        var py = pt.y * Math.cos(tilt) - pt.z * Math.sin(tilt);
        var pz = pt.y * Math.sin(tilt) + pt.z * Math.cos(tilt);
        var proj = project(pt.x, py, pz);
        if (proj.scale < 0) continue;
        var bright = (Math.sin(v * 2 + tick * 0.02) + 1) / 2;
        var thue = 160 + Math.sin(u + tick * 0.01) * 40 + bright * 30;
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, proj.scale * 1.3, 0, Math.PI * 2);
        ctx.fillStyle = hsl(thue, 60 + bright * 30, 25 + bright * 45, 0.18 + bright * 0.25);
        ctx.fill();
      }
    }

    // Inner glow
    var grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, 70);
    grad.addColorStop(0, 'rgba(0,220,180,0.09)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    drawEllipsePath(cx, cy, 70, 48);
    ctx.fill();

    // Pupil
    var pupil = ctx.createRadialGradient(cx, cy, 0, cx, cy, 38);
    pupil.addColorStop(0, 'rgba(0,0,0,1)');
    pupil.addColorStop(0.75, 'rgba(0,10,20,0.97)');
    pupil.addColorStop(1, 'rgba(0,40,60,0.4)');
    ctx.fillStyle = pupil;
    drawEllipsePath(cx, cy, 38, 27);
    ctx.fill();

    // Shimmer rings
    for (var si = 0; si < 3; si++) {
      var phase = tick * 0.03 + si * 1.05;
      ctx.strokeStyle = hsl(180 + si * 20, 80, 70, 0.14 + Math.sin(phase) * 0.07);
      ctx.lineWidth = 1.1;
      drawEllipsePath(cx, cy, 38 + Math.sin(phase) * 3, 27 + Math.cos(phase * 1.3) * 2);
      ctx.stroke();
    }

    // Spikes
    for (var k = 0; k < 110; k++) {
      var a = (k / 110) * Math.PI * 2 + angle * 0.3;
      var baseR = 105 + Math.sin(a * 3 + tick * 0.02) * 8;
      var spikeLen = 48 + Math.sin(a * 5 + tick * 0.015) * 30 + Math.cos(a * 7 + tick * 0.025) * 18;
      var shue = 160 + Math.sin(a * 2 + tick * 0.01) * 50;
      var salpha = 0.14 + Math.abs(Math.sin(a * 4 + tick * 0.02)) * 0.33;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * baseR, cy + Math.sin(a) * baseR * 0.68);
      ctx.lineTo(cx + Math.cos(a) * (baseR + spikeLen), cy + Math.sin(a) * (baseR + spikeLen) * 0.68);
      ctx.strokeStyle = hsl(shue, 70, 75, salpha);
      ctx.lineWidth = 0.65;
      ctx.stroke();
    }

    // Photons
    for (var pi = 0; pi < photons.length; pi++) {
      var ph = photons[pi];
      var wasCollapsed = ph.collapsed;
      ph.update(tick);
      if (!wasCollapsed && ph.collapsed) {
        var rproj = project(ph.x, ph.y, ph.z);
        ripples.push(new Ripple(rproj.sx, rproj.sy));
      }
      if (!ph.collapsed && ph.trail.length > 2) {
        for (var t = 1; t < ph.trail.length; t++) {
          var pa = project(ph.trail[t-1].x, ph.trail[t-1].y, ph.trail[t-1].z);
          var na = project(ph.trail[t].x, ph.trail[t].y, ph.trail[t].z);
          ctx.beginPath();
          ctx.moveTo(pa.sx, pa.sy);
          ctx.lineTo(na.sx, na.sy);
          ctx.strokeStyle = hsl(ph.hue, 85, 75, (t / ph.trail.length) * 0.7);
          ctx.lineWidth = ph.size * 0.5 * pa.scale;
          ctx.stroke();
        }
        var pp = project(ph.x, ph.y, ph.z);
        var pg = ctx.createRadialGradient(pp.sx, pp.sy, 0, pp.sx, pp.sy, ph.size * 2.5 * pp.scale);
        pg.addColorStop(0, hsl(ph.hue, 100, 95, 0.95));
        pg.addColorStop(0.4, hsl(ph.hue, 90, 70, 0.6));
        pg.addColorStop(1, hsl(ph.hue, 80, 60, 0));
        ctx.fillStyle = pg;
        ctx.beginPath();
        ctx.arc(pp.sx, pp.sy, ph.size * 3 * pp.scale, 0, Math.PI * 2);
        ctx.fill();
        var waveR = ph.waveAmp * (1 - ph.life / ph.maxLife) * pp.scale;
        if (waveR > 2) {
          ctx.beginPath();
          ctx.arc(pp.sx, pp.sy, waveR, 0, Math.PI * 2);
          ctx.strokeStyle = hsl(ph.hue, 70, 80, 0.11);
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    // Ripples
    var alive = [];
    for (var ri = 0; ri < ripples.length; ri++) {
      var rip = ripples[ri];
      rip.update();
      ctx.beginPath();
      ctx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(100,255,220,' + (rip.getAlpha() * 0.55) + ')';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      if (!rip.isDead()) alive.push(rip);
    }
    ripples = alive;

    // Label
    ctx.font = '600 9px Courier New, monospace';
    ctx.fillStyle = 'rgba(100,220,200,0.45)';
    ctx.textAlign = 'center';
    ctx.fillText('OBSERVER EFFECT  · WAVE FUNCTION COLLAPSE', cx, H - 14);
  }

  // setInterval is more reliable than requestAnimationFrame for local files on iOS Chrome
  setInterval(draw, 1000 / 60);

})();
</script>
</body>
</html>
